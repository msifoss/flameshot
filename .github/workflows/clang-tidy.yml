name: clang-tidy-diff

# Runs clang-tidy on lines changed by a pull request. Existing violations
# elsewhere in the tree are grandfathered — only NEW violations on changed
# lines block. Drops the entry-cost of adopting clang-tidy from "fix
# everything first" to "don't add anything new."
#
# Triggered only on pull_request; on push to master the existing
# Building(CMake) workflow already produces a green/red signal for the build
# itself.

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'data/translations/*.ts'

  workflow_dispatch:

jobs:
  clang-tidy-diff:
    name: clang-tidy on changed lines
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout (PR head)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch enough history that `git diff` against the base sha works.
          fetch-depth: 0

      - name: Install build + clang-tidy dependencies
        run: |
          sudo apt-get -y -qq update
          sudo apt-get -y --no-install-recommends install \
            cmake \
            extra-cmake-modules \
            build-essential \
            ninja-build \
            qt6-base-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            clang-tidy

      - name: Configure CMake with compile_commands.json
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        # Build is not strictly required for clang-tidy-diff to operate, but
        # AUTOMOC / AUTORCC need to have run at least once so generated
        # sources clang-tidy may encounter via #include actually exist.

      - name: Build (for generated sources)
        run: cmake --build build --parallel

      - name: Locate clang-tidy-diff helper
        id: tidy-tool
        run: |
          # ubuntu-24.04 ships LLVM 19 by default; the script is named
          # `clang-tidy-diff-19.py` or sometimes versionless. Try the
          # specific version first, then fall back to unversioned.
          for candidate in clang-tidy-diff-19 clang-tidy-diff-19.py clang-tidy-diff clang-tidy-diff.py; do
            if command -v "$candidate" >/dev/null; then
              echo "Found: $candidate"
              echo "cmd=$candidate" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "clang-tidy-diff not found on PATH" >&2
          exit 1

      - name: Run clang-tidy on changed lines
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          tool="${{ steps.tidy-tool.outputs.cmd }}"
          # clang-tidy-diff reads a unified diff on stdin and runs clang-tidy
          # only on the touched line ranges. `-p1` matches the path prefix
          # produced by `git diff`. The .clang-tidy file at the repo root
          # supplies the check list.
          #
          # WarningsAsErrors='*' in .clang-tidy means any new violation
          # fails this step. That is the intended behavior; the whole point
          # of diff-mode is that existing violations don't count, only
          # newly-introduced ones.
          git diff -U0 "$base_sha"..HEAD -- '*.cpp' '*.h' \
            | "$tool" -p1 -path build -j "$(nproc)"
